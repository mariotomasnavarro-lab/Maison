}

function progressPage(){let total=state.members.reduce((a,m)=>a+m.coins,0);let monthKey=state.familyMonthlyReward?.month||new Date().toISOString().slice(0,7),reward=state.familyMonthlyReward?.label||'',monthly=state.tasks.filter(t=>t.dueDate&&String(t.dueDate).slice(0,7)===monthKey),done=monthly.filter(t=>t.status==='done').length,won=monthly.length>0&&done===monthly.length;return `<div class="panel monthly-reward"><div class="panel-head"><div><h2>La récompense du foyer</h2><p>Choisissez ensemble une récompense si toutes les tâches datées du mois sont terminées.</p></div><span class="badge">${done}/${monthly.length} terminées</span></div><form class="add-row" onsubmit="saveFamilyReward(event)"><input name="reward" maxlength="120" placeholder="Ex. soirée cinéma ou sortie en famille" value="${esc(reward)}"><button class="btn primary">Enregistrer ensemble</button></form><p class="tiny">Les tâches sans date ne comptent pas. Ajoutez une échéance aux missions concernées. ${won?'🎉 Tout est déjà fait : '+esc(reward||'la récompense commune')+' vous attend à la fin du mois !':'La récompense sera gagnée si toutes les tâches datées sont terminées avant la fin du mois.'}</p></div><div class="panel"><div class="panel-head"><div><h2>Chacun apporte sa petite pierre</h2><p>SuperCoins récoltés au fil des missions.</p></div><span class="badge">${total} ★ au total</span></div><div class="progress-grid">${state.members.map(m=>{let count=state.tasks.filter(t=>t.assignee===m.id&&t.status==='done').length+state.shopping.filter(s=>s.assignee===m.id&&s.checked).length;let pct=Math.min(100,m.coins);return `<div class="progress-card"><div class="member-head"><div class="member-face" style="background:${m.color}33">${m.emoji}</div><div><strong>${esc(m.name)}</strong><small>${m.role==='admin'?'Administrateur':'Membre'}</small></div></div><div class="progress-number">${m.coins} <small>SuperCoins</small></div><div class="progressbar"><span style="width:${pct}%"></span></div><div class="tiny" style
